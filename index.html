<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement MPG</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #14181f;
    --muted: #5d6675;
    --line: #e3e6ec;
    --accent: #1f5fd8;
    --gold: #b8860b;
    --done: #e6f1e9;
    --done-ink: #276b46;
    --live: #e7eefc;
    --live-ink: #1f5fd8;
    --radius: 12px;
    /* Every statistic column is this wide, in every table on the page. */
    --stat-w: 4.25rem;
    --pos-w: 2.6rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131a;
      --panel: #171b24;
      --ink: #eef1f6;
      --muted: #9aa3b2;
      --line: #262c38;
      --accent: #6ea0ff;
      --gold: #f4c542;
      --done: #17301f;
      --done-ink: #7fd0a1;
      --live: #16233c;
      --live-ink: #9cc0ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a;
    --panel: #171b24;
    --ink: #eef1f6;
    --muted: #9aa3b2;
    --line: #262c38;
    --accent: #6ea0ff;
    --gold: #f4c542;
    --done: #17301f;
    --done-ink: #7fd0a1;
    --live: #16233c;
    --live-ink: #9cc0ff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.88rem; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 0.86rem;
    font-family: inherit;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* A flex container beats the browser's own [hidden] rule, so say it here. */
  .tabs[hidden] { display: none; }
  .tabs.sub { margin: -6px 0 14px; padding-left: 14px; gap: 4px; }
  .tabs.sub .tab { padding: 5px 11px; font-size: 0.8rem; border-radius: 7px; }
  .tabs.sub .tab[aria-selected="true"] {
    background: transparent; border-color: var(--accent); color: var(--accent);
  }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; overflow: hidden;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 14px; }
  .note {
    color: var(--muted); font-size: 0.82rem; margin: 0 0 14px;
    padding-left: 10px; border-left: 2px solid var(--accent);
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
  }
  .badge.done { background: var(--done); color: var(--done-ink); }
  .badge.live { background: var(--live); color: var(--live-ink); }

  .filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
    font-family: inherit;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .scroll { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  th {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--muted); font-weight: 600;
  }
  /* One width for every statistic column, everywhere. */
  th.stat, td.stat { width: var(--stat-w); }
  th.pos, td.pos { width: var(--pos-w); text-align: left; padding-left: 8px; }
  th.club, td.club { text-align: left; width: auto; }
  th.alias, td.alias { text-align: left; width: 8rem; color: var(--muted); font-size: 0.82rem; }
  th .short { display: none; }
  tbody tr:hover { background: rgba(127, 127, 127, 0.07); }
  td.pos { font-weight: 600; }
  tr.podium td.pos { color: var(--gold); }
  .name { font-weight: 560; }
  td.key { font-weight: 700; color: var(--ink); }
  td.up { color: var(--done-ink); }
  td.down { color: #b3382f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) td.down { color: #e0705f; }
  }

  footer { color: var(--muted); font-size: 0.78rem; margin-top: 22px; text-align: center; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  /* Phones: keep the team, the goal difference, the ranking metric and how
     many seasons it covers. Everything else is detail you can get on a
     bigger screen. */
  @media (max-width: 620px) {
    :root { --stat-w: 3.6rem; --pos-w: 2.1rem; }
    body { padding: 18px 16px 48px; }
    h1 { font-size: 1.35rem; }
    th:not(.keep), td:not(.keep) { display: none; }
    th .full { display: none; }
    th .short { display: inline; }
    th, td { padding: 10px 5px; }
    .panel { padding: 12px; }
    .tabs.sub { padding-left: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="league">Classement MPG</h1>
    <div class="sub" id="subtitle">Chargement…</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Période"></nav>
  <nav class="tabs sub" id="subtabs" role="tablist" aria-label="Saison" hidden></nav>
  <main class="panel" id="panel"><div class="empty">Chargement…</div></main>
  <footer id="footer"></footer>
</div>

<script>
// MPG's own columns, in MPG's order, plus the ones only a sum can show.
const LABELS = {
  wins: "G.", draws: "N.", losses: "P.", goal_diff: "+/-", points: "Pts",
  goals_for: "bp", goals_against: "bc",
  played: "J", seasons: "Saisons", points_per_match: "Pts/m", titles: "Titres"
};
const TITLES = {
  wins: "Victoires", draws: "Nuls", losses: "Défaites",
  goal_diff: "Différence de buts", points: "Points",
  played: "Journées jouées", seasons: "Saisons MPG jouées",
  points_per_match: "Points par match", titles: "Titres remportés"
};
// Headers that do not fit a narrow column get a short form on phones.
const SHORT = { seasons: "Sais.", titles: "Tit.", played: "J" };
const SEASON_COLS = ["wins", "draws", "losses", "goal_diff", "points"];
// MPG's five first, then what only a sum can show. Points per match sits
// right after points so that whichever of the two ranks the table, a phone
// shows the same shape: difference, metric, seasons.
const SUM_COLS = [
  "wins", "draws", "losses", "goal_diff", "points",
  "points_per_match", "played", "seasons", "titles"
];

// The two ways to read a cumulative table. Which one you pick decides both
// who is listed and what the ranking means, so they travel together.
const VIEWS = {
  all: {
    label: "Tous les participants",
    sortKey: "points_per_match",
    describe: (n) =>
      `tous ceux qui ont joué au moins une des ${n} saisons, classés aux ` +
      `points par match : ils n'ont pas joué le même nombre de matchs, ` +
      `les totaux bruts ne seraient pas comparables.`,
    keep: (row) => row.seasons >= 1,
    sort: (a, b) =>
      b.points_per_match - a.points_per_match || b.points - a.points ||
      b.goal_diff - a.goal_diff
  },
  loyal: {
    label: "Les fidèles",
    sortKey: "points",
    describe: (n) =>
      `seulement ceux présents sur les ${n} saisons, classés aux points ` +
      `totaux : ayant joué exactement les mêmes saisons, ils sont directement ` +
      `comparables.`,
    keep: (row, n) => row.seasons >= n,
    sort: (a, b) =>
      b.points - a.points || b.goal_diff - a.goal_diff || b.wins - a.wins
  }
};

const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const child of [].concat(children)) {
    if (child === null || child === undefined || child === "") continue;
    node.append(child instanceof Node ? child : document.createTextNode(child));
  }
  return node;
};

const signed = (n) => (n > 0 ? "+" + n : String(n));
const when = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });

function cellText(key, raw) {
  if (raw === null || raw === undefined) return "—";
  if (key === "goal_diff") return signed(raw);
  if (key === "points_per_match") return Number(raw).toFixed(2).replace(".", ",");
  return String(raw);
}

/**
 * One table. `keys` are the statistic columns in order; `keep` lists the ones
 * that survive on a phone, alongside the rank and the team.
 */
function renderTable({ rows, keys, labelKey, aliasKey, keep }) {
  const kept = new Set(keep || []);
  const hasAlias = aliasKey && rows.some((r) => (r[aliasKey] || "").trim() &&
                                                r[aliasKey] !== r[labelKey]);

  const head = el("tr", {}, [
    el("th", { class: "pos keep" }, "#"),
    el("th", { class: "club keep" }, "Équipes")
  ]);
  if (hasAlias) head.append(el("th", { class: "alias" }, "Autres noms"));
  for (const key of keys) {
    const label = LABELS[key] || key;
    const short = SHORT[key];
    head.append(el("th", {
      class: "stat" + (kept.has(key) ? " keep" : ""),
      "data-key": key,
      title: TITLES[key] || label
    }, short
      ? [el("span", { class: "full" }, label), el("span", { class: "short" }, short)]
      : label));
  }

  const body = el("tbody");
  rows.forEach((row, index) => {
    const position = index + 1;
    const tr = el("tr", position <= 3 ? { class: "podium" } : {});
    tr.append(el("td", { class: "pos keep" }, String(position)));
    tr.append(el("td", { class: "club keep" }, el("span", { class: "name" }, row[labelKey] || "—")));
    if (hasAlias) tr.append(el("td", { class: "alias" }, row[aliasKey] || ""));
    for (const key of keys) {
      const raw = row[key];
      let cls = "stat" + (kept.has(key) ? " keep" : "");
      if (key === "goal_diff" && typeof raw === "number") cls += raw > 0 ? " up" : raw < 0 ? " down" : "";
      tr.append(el("td", { class: cls, "data-key": key }, cellText(key, raw)));
    }
    body.append(tr);
  });

  return el("div", { class: "scroll" }, [el("table", {}, [el("thead", {}, head), body])]);
}

function statusBadge(isFinal) {
  return el("span", { class: "badge " + (isFinal ? "done" : "live") },
            isFinal ? "Terminée" : "En cours");
}

function standingPanel(standing) {
  const goals = standing.rows.some((r) => r.goals_for !== null && r.goals_for !== undefined);
  const keys = goals ? SEASON_COLS.concat(["goals_for", "goals_against"]) : SEASON_COLS;
  return [
    el("h2", {}, [standing.season_label, statusBadge(standing.is_final)]),
    el("div", { class: "meta" },
      `saison de football ${standing.football_season} · journée ` +
      `${standing.matchday}/${standing.total_matchdays} · ` +
      `${standing.rows.length} équipes · relevé du ${when(standing.captured_at)}`),
    renderTable({
      rows: [...standing.rows].sort((a, b) => a.rank - b.rank),
      keys,
      labelKey: "team",
      aliasKey: "manager",
      keep: ["goal_diff", "points"]
    })
  ];
}

/** A cumulative table, with the filter that decides who is in it and how it ranks. */
function cumulativePanel({ title, meta, table, seasonCount }) {
  const heading = el("h2", {}, title);
  const line = el("div", { class: "meta" }, meta);
  const note = el("p", { class: "note" }, "");
  const holder = el("div", {});
  const buttons = {};

  const apply = (name) => {
    const view = VIEWS[name];
    for (const [key, button] of Object.entries(buttons)) {
      button.setAttribute("aria-pressed", String(key === name));
    }
    note.textContent = view.describe(seasonCount);
    const rows = table.filter((r) => view.keep(r, seasonCount)).sort(view.sort);
    holder.replaceChildren(
      rows.length
        ? renderTable({
            rows,
            keys: SUM_COLS.map((k) => k),
            labelKey: "identity",
            aliasKey: "teams",
            // On a phone: the difference, the metric it is ranked on, and
            // how many seasons that covers.
            keep: ["goal_diff", view.sortKey, "seasons"]
          })
        : el("div", { class: "empty" }, "Personne n’a joué toutes les saisons.")
    );
  };

  const filter = el("div", { class: "filter", role: "group", "aria-label": "Qui comparer" });
  for (const [name, view] of Object.entries(VIEWS)) {
    const button = el("button", { class: "chip", type: "button", "aria-pressed": "false" }, view.label);
    button.addEventListener("click", () => apply(name));
    buttons[name] = button;
    filter.append(button);
  }

  apply("all");
  return [heading, line, filter, note, holder];
}

function alltimePanel(data) {
  const seasons = data.seasons
    .map((s) => `${s.season_label} ${s.football_season}`)
    .join(" · ");
  return cumulativePanel({
    title: "Cumul général",
    meta: `toute l’histoire de la ligue · ${data.seasons.length} saison(s) MPG · ${seasons}`,
    table: data.alltime,
    seasonCount: data.seasons.length
  });
}

function footballSeasonPanel(entry) {
  return cumulativePanel({
    title: `Cumul ${entry.label}`,
    meta: `les ${entry.seasons.length} saisons MPG jouées en ${entry.label} ` +
          `additionnées : ${entry.seasons.join(", ")}`,
    table: entry.table,
    seasonCount: entry.seasons.length
  });
}

function render(data) {
  document.title = data.league + " — classement";
  document.getElementById("league").textContent = data.league;
  const latest = data.latest;
  document.getElementById("subtitle").textContent = latest
    ? `${latest.season_label} · journée ${latest.matchday}/${latest.total_matchdays} · mis à jour le ${when(data.generated_at)}`
    : "Aucun relevé pour l’instant.";
  document.getElementById("footer").textContent =
    `${data.runs.length} relevé(s) enregistré(s) · données générées le ${when(data.generated_at)}`;

  // The tabs follow the way the competition is actually nested:
  // the whole history > one football season > one MPG league inside it.
  // A football season that held a single league has nothing to group, so it
  // shows that league directly instead of an identical "cumul" beside it.
  const seasonNumber = (s) => parseInt(String(s.season_id).replace(/\D/g, ""), 10) || 0;
  const scopes = [
    { id: "alltime", label: "Tout l’historique",
      panels: [{ id: "alltime", label: "Cumul", build: () => alltimePanel(data) }] }
  ];

  for (const entry of data.football_seasons || []) {
    const runs = data.seasons
      .filter((s) => s.football_season === entry.label)
      .sort((a, b) => seasonNumber(b) - seasonNumber(a));
    const panels = runs.map((season) => ({
      id: season.season_id,
      label: season.season_label,
      build: () => standingPanel(season)
    }));
    if (runs.length > 1) {
      panels.unshift({
        id: "cumul-" + entry.label,
        label: "Cumul",
        build: () => footballSeasonPanel(entry)
      });
    }
    scopes.push({ id: "fs-" + entry.label, label: entry.label, panels });
  }

  const tabs = document.getElementById("tabs");
  const subtabs = document.getElementById("subtabs");
  const panel = document.getElementById("panel");
  tabs.replaceChildren();   // rendering twice must not stack two rows of tabs
  let current = null;

  const showPanel = (scope, panelId) => {
    const chosen = scope.panels.find((p) => p.id === panelId) || scope.panels[0];
    for (const button of subtabs.children) {
      button.setAttribute("aria-selected", String(button.dataset.id === chosen.id));
    }
    panel.replaceChildren(...chosen.build());
  };

  const showScope = (scopeId, panelId) => {
    current = scopes.find((s) => s.id === scopeId) || scopes[0];
    for (const button of tabs.children) {
      button.setAttribute("aria-selected", String(button.dataset.id === current.id));
    }
    // A single panel needs no second row: the scope tab already picked it.
    subtabs.replaceChildren();
    subtabs.hidden = current.panels.length < 2;
    if (!subtabs.hidden) {
      for (const view of current.panels) {
        const button = el("button", { class: "tab", role: "tab", "aria-selected": "false" }, view.label);
        button.dataset.id = view.id;
        button.addEventListener("click", () => showPanel(current, view.id));
        subtabs.append(button);
      }
    }
    showPanel(current, panelId);
  };

  for (const scope of scopes) {
    const button = el("button", { class: "tab", role: "tab", "aria-selected": "false" }, scope.label);
    button.dataset.id = scope.id;
    button.addEventListener("click", () => showScope(scope.id));
    tabs.append(button);
  }

  // Open on what is being played right now.
  const running = data.seasons[data.seasons.length - 1];
  showScope(running ? "fs-" + running.football_season : "alltime",
            running ? running.season_id : "alltime");
}

fetch("data/standings.json", { cache: "no-store" })
  .then((response) => {
    if (!response.ok) throw new Error(response.status);
    return response.json();
  })
  .then(render)
  .catch(() => {
    document.getElementById("subtitle").textContent = "";
    document.getElementById("panel").replaceChildren(
      el("div", { class: "empty" }, "Aucune donnée : lancez `python -m mpg run` puis rechargez.")
    );
  });
</script>
</body>
</html>
