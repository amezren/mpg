<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement MPG</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #14181f;
    --muted: #5d6675;
    --line: #e3e6ec;
    --accent: #1f5fd8;
    --gold: #f4c542;
    --final: #dff1e3;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a;
      --panel: #171b24;
      --ink: #eef1f6;
      --muted: #9aa3b2;
      --line: #262c38;
      --accent: #6ea0ff;
      --final: #1d3326;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.88rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 0.86rem;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; overflow: hidden;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 14px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--final); color: var(--ink); font-size: 0.74rem; margin-left: 6px;
  }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }
  tbody tr:hover { background: rgba(127, 127, 127, 0.07); }
  td.rank { font-weight: 600; width: 34px; }
  tr.podium td.rank { color: #b8860b; }
  @media (prefers-color-scheme: dark) { tr.podium td.rank { color: var(--gold); } }
  .name { font-weight: 560; }
  .pos { color: var(--muted); font-size: 0.82rem; }
  .pts { font-weight: 650; }
  figure { margin: 18px 0 0; }
  figure img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
  figcaption { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
  footer { color: var(--muted); font-size: 0.78rem; margin-top: 22px; text-align: center; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="league">Classement MPG</h1>
    <div class="sub" id="subtitle">Chargement…</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="panel" id="panel"><div class="empty">Chargement…</div></main>
  <footer id="footer"></footer>
</div>

<script>
// MPG publishes G / N / P / +/- / Pts only; goals for and against are shown
// when a table happens to carry them.
const BASE_COLS = [
  ["points", "Pts", "pts"], ["played", "J", ""], ["wins", "G", ""],
  ["draws", "N", ""], ["losses", "P", ""], ["goal_diff", "+/-", ""]
];
const GOAL_COLS = [["goals_for", "bp", ""], ["goals_against", "bc", ""]];
const ALLTIME_COLS = [
  ["points", "Pts", "pts"], ["played", "J", ""], ["wins", "G", ""], ["draws", "N", ""],
  ["losses", "P", ""], ["goal_diff", "+/-", ""], ["points_per_match", "Pts/m", ""],
  ["seasons", "Saisons", ""], ["titles", "Titres", ""]
];
const colsFor = (rows) =>
  rows.some((r) => r.goals_for !== null && r.goals_for !== undefined)
    ? BASE_COLS.concat(GOAL_COLS)
    : BASE_COLS;

const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const child of [].concat(children)) {
    node.append(child instanceof Node ? child : document.createTextNode(child));
  }
  return node;
};

const signed = (n) => (n > 0 ? "+" + n : String(n));
const when = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });

function table(rows, cols, labelKey, subKey) {
  // MPG shows team names only, so the second label column is dropped unless
  // there is something to put in it (a manager, or names used in past seasons).
  const hasSub = rows.some((r) => (r[subKey] || "").trim() !== "" && r[subKey] !== r[labelKey]);
  const head = el("tr", {}, [el("th", {}, "#"), el("th", {}, "Équipe")]);
  if (hasSub) head.append(el("th", {}, labelKey === "identity" ? "Autres noms" : "Manager"));
  for (const [, label] of cols) head.append(el("th", {}, label));

  const body = el("tbody");
  for (const row of rows) {
    const tr = el("tr", row.rank <= 3 ? { class: "podium" } : {});
    tr.append(el("td", { class: "rank" }, String(row.rank)));
    tr.append(el("td", {}, el("span", { class: "name" }, row[labelKey] || "—")));
    if (hasSub) tr.append(el("td", {}, el("span", { class: "pos" }, row[subKey] || "")));
    for (const [key, , cls] of cols) {
      const raw = row[key];
      const value = raw === null || raw === undefined
        ? "-"
        : (key === "goal_diff" ? signed(raw) : raw);
      tr.append(el("td", cls ? { class: cls } : {}, String(value)));
    }
    body.append(tr);
  }
  return el("div", { class: "scroll" }, [el("table", {}, [el("thead", {}, head), body])]);
}

function standingPanel(standing) {
  const final = standing.is_final
    ? el("span", { class: "badge" }, "Journée finale")
    : "";
  const parts = [
    el("h2", {}, [standing.season_label, final]),
    el("div", { class: "meta" },
      `Journée ${standing.matchday}/${standing.total_matchdays} · relevé du ${when(standing.captured_at)}`),
    table(standing.rows, colsFor(standing.rows), "team", "manager")
  ];
  return parts;
}

function alltimePanel(data) {
  const seasons = data.seasons.map((s) => `${s.season_label} (J${s.matchday})`).join(" · ");
  return [
    el("h2", {}, "Classement cumulé"),
    el("div", { class: "meta" }, `${data.seasons.length} saison(s) · ${seasons}`),
    table(data.alltime, ALLTIME_COLS, "identity", "teams")
  ];
}

function render(data) {
  document.title = data.league + " — classement";
  document.getElementById("league").textContent = data.league;
  const latest = data.latest;
  document.getElementById("subtitle").textContent = latest
    ? `${latest.season_label} · journée ${latest.matchday}/${latest.total_matchdays} · mis à jour le ${when(data.generated_at)}`
    : "Aucun relevé pour l’instant.";
  document.getElementById("footer").textContent =
    `${data.runs.length} relevé(s) enregistré(s) · données générées le ${when(data.generated_at)}`;

  const views = [{ id: "alltime", label: "Cumulé", build: () => alltimePanel(data) }];
  for (const season of [...data.seasons].reverse()) {
    views.push({
      id: season.season_id,
      label: season.season_label + (season.is_final ? " ✓" : ""),
      build: () => standingPanel(season)
    });
  }

  const tabs = document.getElementById("tabs");
  const panel = document.getElementById("panel");
  const show = (id) => {
    for (const button of tabs.children) {
      button.setAttribute("aria-selected", String(button.dataset.id === id));
    }
    panel.replaceChildren(...views.find((v) => v.id === id).build());
  };
  for (const view of views) {
    const button = el("button", { class: "tab", role: "tab", "aria-selected": "false" }, view.label);
    button.dataset.id = view.id;
    button.addEventListener("click", () => show(view.id));
    tabs.append(button);
  }
  show(data.latest && data.seasons.length ? data.seasons[data.seasons.length - 1].season_id : "alltime");
}

fetch("data/standings.json", { cache: "no-store" })
  .then((response) => {
    if (!response.ok) throw new Error(response.status);
    return response.json();
  })
  .then(render)
  .catch(() => {
    document.getElementById("subtitle").textContent = "";
    document.getElementById("panel").replaceChildren(
      el("div", { class: "empty" }, "Aucune donnée : lancez `python -m mpg run` puis rechargez.")
    );
  });
</script>
</body>
</html>
