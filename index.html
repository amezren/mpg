<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement MPG</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #14181f;
    --muted: #5d6675;
    --line: #e3e6ec;
    --accent: #1f5fd8;
    --gold: #b8860b;
    --done: #e6f1e9;
    --done-ink: #276b46;
    --live: #e7eefc;
    --live-ink: #1f5fd8;
    --radius: 12px;
    /* Every statistic column is this wide, in every table on the page. */
    --stat-w: 4.25rem;
    --pos-w: 2.6rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131a;
      --panel: #171b24;
      --ink: #eef1f6;
      --muted: #9aa3b2;
      --line: #262c38;
      --accent: #6ea0ff;
      --gold: #f4c542;
      --done: #17301f;
      --done-ink: #7fd0a1;
      --live: #16233c;
      --live-ink: #9cc0ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a;
    --panel: #171b24;
    --ink: #eef1f6;
    --muted: #9aa3b2;
    --line: #262c38;
    --accent: #6ea0ff;
    --gold: #f4c542;
    --done: #17301f;
    --done-ink: #7fd0a1;
    --live: #16233c;
    --live-ink: #9cc0ff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.88rem; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 0.86rem;
    font-family: inherit;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Every table of the chosen period, one under the other. */
  #stack { display: flex; flex-direction: column; gap: 14px; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; overflow: hidden;
  }
  .panel h2 {
    font-size: 1.05rem; margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
  }
  .badge.done { background: var(--done); color: var(--done-ink); }
  .badge.live { background: var(--live); color: var(--live-ink); }

  .filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
    font-family: inherit;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .scroll { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  th {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--muted); font-weight: 600;
  }
  /* One width for every statistic column, everywhere. */
  th.stat, td.stat { width: var(--stat-w); }
  th.pos, td.pos { width: var(--pos-w); text-align: left; padding-left: 8px; }
  th.club, td.club { text-align: left; width: auto; }
  th.alias, td.alias { text-align: left; width: 8rem; color: var(--muted); font-size: 0.82rem; }
  th .short { display: none; }
  tbody tr:hover { background: rgba(127, 127, 127, 0.07); }
  td.pos { font-weight: 600; }
  tr.podium td.pos { color: var(--gold); }
  .name { font-weight: 560; }
  td.key { font-weight: 700; color: var(--ink); }
  td.up { color: var(--done-ink); }
  td.down { color: #b3382f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) td.down { color: #e0705f; }
  }

  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  /* A table drops columns as soon as it stops fitting, rather than at one
     width for the whole page: the cumulative table carries nine statistics
     and runs out of room long before a season table does. Team names must
     never be clipped, and the page must never scroll sideways. */

  /* Cumulative tables, first step: the extras go. */
  @media (max-width: 1040px) {
    .wide th:not(.keep):not(.mid), .wide td:not(.keep):not(.mid) { display: none; }
  }
  /* Cumulative tables, second step: down to the essentials. */
  @media (max-width: 760px) {
    .wide th:not(.keep), .wide td:not(.keep) { display: none; }
  }
  /* Season tables hold five statistics and fit much further down. */
  @media (max-width: 660px) {
    th:not(.keep), td:not(.keep) { display: none; }
  }
  /* Phones. */
  @media (max-width: 660px) {
    :root { --stat-w: 3.6rem; --pos-w: 2.1rem; }
    body { padding: 18px 16px 48px; }
    h1 { font-size: 1.35rem; }
    th .full { display: none; }
    th .short { display: inline; }
    th, td { padding: 10px 5px; }
    .panel { padding: 12px; }
    #stack { gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="league">Classement MPG</h1>
    <div class="sub" id="subtitle">Chargement…</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Période"></nav>
  <main id="stack"><section class="panel"><div class="empty">Chargement…</div></section></main>
</div>

<script>
// MPG's own columns, in MPG's order, plus the ones only a sum can show.
const LABELS = {
  wins: "G.", draws: "N.", losses: "P.", goal_diff: "+/-", points: "Pts",
  goals_for: "bp", goals_against: "bc",
  played: "J", seasons: "Saisons", points_per_match: "Pts/m", titles: "Titres"
};
const TITLES = {
  wins: "Victoires", draws: "Nuls", losses: "Défaites",
  goal_diff: "Différence de buts", points: "Points",
  played: "Journées jouées", seasons: "Saisons MPG jouées",
  points_per_match: "Points par match", titles: "Titres remportés"
};
// Headers that do not fit a narrow column get a short form on phones.
const SHORT = { seasons: "Sais.", titles: "Tit.", played: "J" };
const SEASON_COLS = ["wins", "draws", "losses", "goal_diff", "points"];
// MPG's five first, then what only a sum can show. Points per match sits
// right after points so that whichever of the two ranks the table, a phone
// shows the same shape: difference, metric, seasons.
const SUM_COLS = [
  "wins", "draws", "losses", "goal_diff", "points",
  "points_per_match", "played", "seasons", "titles"
];

// Everyone who played at least one season is listed. Seasons are of unequal
// length, so the table can be read two ways and the buttons pick which.
const SORTS = {
  points: {
    label: "Points",
    key: "points",
    compare: (a, b) =>
      b.points - a.points || b.goal_diff - a.goal_diff || b.wins - a.wins
  },
  average: {
    label: "Points / match",
    key: "points_per_match",
    compare: (a, b) =>
      b.points_per_match - a.points_per_match || b.points - a.points ||
      b.goal_diff - a.goal_diff
  }
};

const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const child of [].concat(children)) {
    if (child === null || child === undefined || child === "") continue;
    node.append(child instanceof Node ? child : document.createTextNode(child));
  }
  return node;
};

const signed = (n) => (n > 0 ? "+" + n : String(n));
const when = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });

function cellText(key, raw) {
  if (raw === null || raw === undefined) return "—";
  if (key === "goal_diff") return signed(raw);
  if (key === "points_per_match") return Number(raw).toFixed(2).replace(".", ",");
  return String(raw);
}

/**
 * One table. `keys` are the statistic columns in order; `keep` lists the ones
 * that survive on a phone, alongside the rank and the team.
 */
function renderTable({ rows, keys, labelKey, aliasKey, keep, mid, wide }) {
  const kept = new Set(keep || []);
  const middle = new Set(mid || []);
  const cls = (key) =>
    "stat" + (kept.has(key) ? " keep" : middle.has(key) ? " mid" : "");
  const hasAlias = aliasKey && rows.some((r) => (r[aliasKey] || "").trim() &&
                                                r[aliasKey] !== r[labelKey]);

  const head = el("tr", {}, [
    el("th", { class: "pos keep" }, "#"),
    el("th", { class: "club keep" }, "Équipes")
  ]);
  if (hasAlias) head.append(el("th", { class: "alias" }, "Autres noms"));
  for (const key of keys) {
    const label = LABELS[key] || key;
    const short = SHORT[key];
    head.append(el("th", {
      class: cls(key),
      "data-key": key,
      title: TITLES[key] || label
    }, short
      ? [el("span", { class: "full" }, label), el("span", { class: "short" }, short)]
      : label));
  }

  const body = el("tbody");
  rows.forEach((row, index) => {
    const position = index + 1;
    const tr = el("tr", position <= 3 ? { class: "podium" } : {});
    tr.append(el("td", { class: "pos keep" }, String(position)));
    tr.append(el("td", { class: "club keep" }, el("span", { class: "name" }, row[labelKey] || "—")));
    if (hasAlias) tr.append(el("td", { class: "alias" }, row[aliasKey] || ""));
    for (const key of keys) {
      const raw = row[key];
      let klass = cls(key);
      if (key === "goal_diff" && typeof raw === "number") {
        klass += raw > 0 ? " up" : raw < 0 ? " down" : "";
      }
      tr.append(el("td", { class: klass, "data-key": key }, cellText(key, raw)));
    }
    body.append(tr);
  });

  return el("div", { class: "scroll" }, [
    el("table", wide ? { class: "wide" } : {}, [el("thead", {}, head), body])
  ]);
}

function statusBadge(isFinal) {
  return el("span", { class: "badge " + (isFinal ? "done" : "live") },
            isFinal ? "Terminée" : "En cours");
}

function standingPanel(standing) {
  const goals = standing.rows.some((r) => r.goals_for !== null && r.goals_for !== undefined);
  const keys = goals ? SEASON_COLS.concat(["goals_for", "goals_against"]) : SEASON_COLS;
  return [
    el("h2", {}, [standing.season_label, statusBadge(standing.is_final)]),
    renderTable({
      rows: [...standing.rows].sort((a, b) => a.rank - b.rank),
      keys,
      labelKey: "team",
      aliasKey: "manager",
      keep: ["goal_diff", "points"]
    })
  ];
}

/** A cumulative table: everyone who played, sorted the way the buttons say. */
function cumulativePanel({ title, table }) {
  const holder = el("div", {});
  const buttons = {};

  const apply = (name) => {
    const sort = SORTS[name];
    for (const [key, button] of Object.entries(buttons)) {
      button.setAttribute("aria-pressed", String(key === name));
    }
    holder.replaceChildren(renderTable({
      rows: [...table].sort(sort.compare),
      keys: SUM_COLS,
      labelKey: "identity",
      aliasKey: "teams",
      wide: true,
      // Narrow: the difference, the metric it is sorted on, and how many
      // seasons that covers. Medium: MPG's own five as well.
      keep: ["goal_diff", sort.key, "seasons"],
      mid: ["wins", "draws", "losses", "points", "points_per_match"]
    }));
  };

  const controls = el("div", { class: "filter", role: "group", "aria-label": "Trier par" });
  for (const [name, sort] of Object.entries(SORTS)) {
    const button = el("button", { class: "chip", type: "button", "aria-pressed": "false" }, sort.label);
    button.addEventListener("click", () => apply(name));
    buttons[name] = button;
    controls.append(button);
  }

  apply("points");
  return [el("h2", {}, title), controls, holder];
}

function alltimePanel(data) {
  return cumulativePanel({ title: "Cumul général", table: data.alltime });
}

function footballSeasonPanel(entry) {
  return cumulativePanel({ title: `Cumul ${entry.label}`, table: entry.table });
}

function render(data) {
  document.title = data.league + " — classement";
  document.getElementById("league").textContent = data.league;
  document.getElementById("subtitle").textContent =
    "Mise à jour le " + when(data.generated_at);

  // The tabs follow the way the competition is actually nested:
  // the whole history > one football season > one MPG league inside it.
  // A football season that held a single league has nothing to group, so it
  // shows that league directly instead of an identical "cumul" beside it.
  const seasonNumber = (s) => parseInt(String(s.season_id).replace(/\D/g, ""), 10) || 0;

  // The tabs pick a period: the whole history, or one football season. A
  // football season shows everything it holds, stacked - its cumulative table
  // first when there is more than one league to add up, then each league from
  // the most recent down.
  const scopes = [
    { id: "alltime", label: "Tout l’historique", blocks: () => [alltimePanel(data)] }
  ];

  for (const entry of data.football_seasons || []) {
    const runs = data.seasons
      .filter((s) => s.football_season === entry.label)
      .sort((a, b) => seasonNumber(b) - seasonNumber(a));
    scopes.push({
      id: "fs-" + entry.label,
      label: entry.label,
      blocks: () => [
        ...(runs.length > 1 ? [footballSeasonPanel(entry)] : []),
        ...runs.map((season) => standingPanel(season))
      ]
    });
  }

  const tabs = document.getElementById("tabs");
  const stack = document.getElementById("stack");
  tabs.replaceChildren();   // rendering twice must not stack two rows of tabs

  const showScope = (scopeId) => {
    const scope = scopes.find((s) => s.id === scopeId) || scopes[0];
    for (const button of tabs.children) {
      button.setAttribute("aria-selected", String(button.dataset.id === scope.id));
    }
    stack.replaceChildren(
      ...scope.blocks().map((parts) => el("section", { class: "panel" }, parts))
    );
  };

  for (const scope of scopes) {
    const button = el("button", { class: "tab", role: "tab", "aria-selected": "false" }, scope.label);
    button.dataset.id = scope.id;
    button.addEventListener("click", () => showScope(scope.id));
    tabs.append(button);
  }

  // Open on what is being played right now.
  const running = data.seasons[data.seasons.length - 1];
  showScope(running ? "fs-" + running.football_season : "alltime");
}

fetch("data/standings.json", { cache: "no-store" })
  .then((response) => {
    if (!response.ok) throw new Error(response.status);
    return response.json();
  })
  .then(render)
  .catch(() => {
    document.getElementById("subtitle").textContent = "";
    document.getElementById("stack").replaceChildren(
      el("section", { class: "panel" }, el("div", { class: "empty" }, "Aucune donnée."))
    );
  });
</script>
</body>
</html>
